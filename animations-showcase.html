<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Animation Showcase</title>
<style>
  :root{
    --bg:#0b0c14;
    --panel:#14161f;
    --pink:#ff5f9e;
    --purple:#a78bfa;
    --cyan:#5eead4;
    --yellow:#fde047;
    --text:#eef0f5;
    --muted:#8a8fa3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:radial-gradient(circle at top, #171a26, var(--bg) 60%);
    color:var(--text);
    font-family:'Segoe UI', system-ui, sans-serif;
    padding:50px 20px 80px;
  }
  h1{
    text-align:center;
    margin-bottom:6px;
    background:linear-gradient(90deg, var(--pink), var(--purple), var(--cyan));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    background-size:200% auto;
    animation:hue 6s linear infinite;
  }
  @keyframes hue{
    to{ background-position:200% center; }
  }
  p.sub{ text-align:center; color:var(--muted); margin-bottom:60px; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
    gap:26px;
    max-width:1150px;
    margin:0 auto;
  }
  .card{
    background:var(--panel);
    border-radius:16px;
    padding:24px;
    text-align:center;
    border:1px solid #23273a;
    overflow:hidden;
  }
  .card h3{
    margin-top:0;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--cyan);
  }
  .stage{
    height:130px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  /* 1. Bounce */
  .bounce{
    width:50px; height:50px;
    background:var(--pink);
    border-radius:50%;
    animation:bounce 1s ease-in-out infinite;
  }
  @keyframes bounce{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-45px); }
  }

  /* 2. Pulse glow */
  .pulse{
    width:60px; height:60px;
    background:var(--purple);
    border-radius:50%;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(167,139,250,.6); transform:scale(1); }
    70%{ box-shadow:0 0 0 22px rgba(167,139,250,0); transform:scale(1.08); }
    100%{ box-shadow:0 0 0 0 rgba(167,139,250,0); transform:scale(1); }
  }

  /* 3. Spinner */
  .spinner{
    width:54px; height:54px;
    border:5px solid #262b3b;
    border-top-color:var(--cyan);
    border-radius:50%;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* 4. Floating card */
  .float{
    width:80px; height:60px;
    background:linear-gradient(135deg,var(--cyan),#22d3ee);
    border-radius:10px;
    animation:float 3s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-16px) rotate(4deg); }
  }

  /* 5. Wobbling shape morph */
  .blob{
    width:70px; height:70px;
    background:var(--yellow);
    animation:blobmorph 4s ease-in-out infinite;
  }
  @keyframes blobmorph{
    0%,100%{ border-radius:42% 58% 63% 37% / 41% 44% 56% 59%; }
    50%{ border-radius:63% 37% 37% 63% / 59% 41% 59% 41%; }
  }

  /* 6. Typing text */
  .typing-wrap{ font-family:monospace; font-size:18px; color:var(--cyan); }
  .typing{
    display:inline-block;
    overflow:hidden;
    white-space:nowrap;
    border-right:2px solid var(--cyan);
    animation:typing 3s steps(14,end) infinite, blinkcursor 0.7s step-end infinite;
  }
  @keyframes typing{
    0%{ width:0; }
    60%{ width:8.5ch; }
    100%{ width:8.5ch; }
  }
  @keyframes blinkcursor{
    50%{ border-color:transparent; }
  }

  /* 7. Progress bar shimmer */
  .barwrap{
    width:100%;
    height:14px;
    background:#232637;
    border-radius:8px;
    overflow:hidden;
  }
  .bar{
    height:100%;
    width:40%;
    background:linear-gradient(90deg, var(--pink), var(--purple));
    border-radius:8px;
    animation:loadbar 2.2s ease-in-out infinite;
  }
  @keyframes loadbar{
    0%{ transform:translateX(-100%); }
    100%{ transform:translateX(250%); }
  }

  /* 8. Card entrance (runs once on load, staggered) */
  .entrance-card{
    opacity:0;
    animation:enter 0.7s ease forwards;
  }
  .entrance-card:nth-of-type(1){ animation-delay:.05s; }
  .entrance-card:nth-of-type(2){ animation-delay:.15s; }
  .entrance-card:nth-of-type(3){ animation-delay:.25s; }
  @keyframes enter{
    from{ opacity:0; transform:translateY(24px) scale(.95); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  /* 9. Heartbeat icon */
  .heart{
    font-size:46px;
    animation:heartbeat 1.1s ease-in-out infinite;
  }
  @keyframes heartbeat{
    0%,100%{ transform:scale(1); }
    15%{ transform:scale(1.25); }
    30%{ transform:scale(1); }
    45%{ transform:scale(1.2); }
    60%{ transform:scale(1); }
  }

  /* 10. Orbit */
  .orbit-wrap{ width:90px; height:90px; position:relative; }
  .orbit-center{
    position:absolute; top:50%; left:50%;
    width:14px; height:14px;
    background:var(--yellow);
    border-radius:50%;
    transform:translate(-50%,-50%);
  }
  .orbit-moon{
    position:absolute; top:0; left:50%;
    width:12px; height:12px;
    background:var(--cyan);
    border-radius:50%;
    transform-origin:6px 45px;
    animation:orbit 2.4s linear infinite;
  }
  @keyframes orbit{ to{ transform:rotate(360deg); } }

  footer{
    text-align:center;
    color:var(--muted);
    margin-top:60px;
    font-size:13px;
  }
</style>
</head>
<body>

  <h1>CSS Animation Showcase</h1>
  <p class="sub">Pure CSS @keyframes — no JavaScript required</p>

  <div class="grid">

    <div class="card entrance-card">
      <h3>Bounce</h3>
      <div class="stage"><div class="bounce"></div></div>
    </div>

    <div class="card entrance-card">
      <h3>Pulse Ring</h3>
      <div class="stage"><div class="pulse"></div></div>
    </div>

    <div class="card entrance-card">
      <h3>Spinner</h3>
      <div class="stage"><div class="spinner"></div></div>
    </div>

    <div class="card">
      <h3>Float</h3>
      <div class="stage"><div class="float"></div></div>
    </div>

    <div class="card">
      <h3>Blob Morph</h3>
      <div class="stage"><div class="blob"></div></div>
    </div>

    <div class="card">
      <h3>Typewriter</h3>
      <div class="stage typing-wrap"><span class="typing">hello world</span></div>
    </div>

    <div class="card">
      <h3>Loading Bar</h3>
      <div class="stage"><div class="barwrap"><div class="bar"></div></div></div>
    </div>

    <div class="card">
      <h3>Heartbeat</h3>
      <div class="stage"><div class="heart">❤️</div></div>
    </div>

    <div class="card">
      <h3>Orbit</h3>
      <div class="stage">
        <div class="orbit-wrap">
          <div class="orbit-center"></div>
          <div class="orbit-moon"></div>
        </div>
      </div>
    </div>

  </div>

  <footer>Tip: combine multiple keyframe animations on one element with a comma-separated list for richer motion.</footer>

</body>
</html>
